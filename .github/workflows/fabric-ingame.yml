name: Fabric in-game check

# Runs the real Minecraft 1.21.11 client with the Cirrus mod on a virtual display and publishes the screenshots.
on:
  push:
    branches: [fabric-ui-rendering]
  workflow_dispatch:

jobs:
  inspect-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fabric-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the mod (this also downloads Minecraft and Fabric API)
        run: java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain build --no-daemon
      - name: Dump the real API signatures
        run: |
          MC=$(find ~/.gradle -name '*.jar' | grep -iE 'minecraft-clientonly-1' | grep -v sources | head -1)
          GT=$(find ~/.gradle -name 'fabric-client-gametest-api-v1*.jar' | grep -v sources | head -1)
          show() { echo "#### $2"; javap -public -cp "$1" "$2" 2>&1 | sed 's/net\.minecraft\.//g; s/java\.lang\.//g'; }
          for c in net.minecraft.client.gui.components.Button net.minecraft.client.gui.components.AbstractButton net.minecraft.client.gui.components.AbstractWidget net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.screens.TitleScreen net.minecraft.client.gui.Font net.minecraft.client.Minecraft net.minecraft.client.renderer.RenderPipelines net.minecraft.client.gui.components.Renderable; do show "$MC" "$c"; done | grep -vE 'access\$|lambda\$' | cut -c1-210 > /tmp/dump1.txt
          for c in com.mojang.blaze3d.platform.Window; do show "$MC" "$c"; done | cut -c1-200 >> /tmp/dump1.txt
          for c in net.fabricmc.fabric.api.client.gametest.v1.screenshot.TestScreenshotOptions net.fabricmc.fabric.api.client.gametest.v1.TestInput net.fabricmc.fabric.api.client.gametest.v1.FabricClientGameTest; do show "$GT" "$c"; done | cut -c1-200 >> /tmp/dump1.txt
          wc -l /tmp/dump1.txt
          cat /tmp/dump1.txt
