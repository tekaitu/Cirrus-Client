name: Fabric in-game check

# Runs the real Minecraft 1.21.11 client with the Cirrus mod on a virtual display and publishes the screenshots.
on:
  push:
    branches: [fabric-ui-rendering]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: fabric-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install a virtual display and software OpenGL
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libgl1 mesa-vulkan-drivers libxrandr2 libxxf86vm1 libxcursor1 libxi6 libopenal1
      - name: Unit tests
        run: java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain build --no-daemon
      - name: Dump protected widget hooks and GuiGraphics API
        continue-on-error: true
        run: |
          MC=$(find ~/.gradle -name '*.jar' | grep -iE 'minecraft-clientonly-1' | grep -v sources | head -1)
          GT=$(find ~/.gradle -name 'fabric-client-gametest-api-v1*.jar' | grep -v sources | head -1)
          show() { echo "#### $2"; javap -protected -cp "$1" "$2" 2>&1 | sed 's/net\.minecraft\.//g; s/java\.lang\.//g'; }
          for c in 'net.minecraft.client.gui.components.AbstractWidget' 'net.minecraft.client.gui.components.AbstractWidget$WithInactiveMessage' net.minecraft.client.gui.components.AbstractButton net.minecraft.client.gui.components.Button; do show "$MC" "$c"; done | grep -vE 'access\$|lambda\$' | cut -c1-200
          echo "#### GuiGraphics"
          javap -public -cp "$MC" net.minecraft.client.gui.GuiGraphics 2>&1 | sed 's/net\.minecraft\.//g; s/java\.lang\.//g' | grep -E "blit|fill|pose|drawString|drawCentered|Scissor|renderTooltip|nextStratum|guiWidth|guiHeight|setTooltip|renderOutline|textHighlight|drawWordWrap" | cut -c1-230
          for c in com.mojang.blaze3d.platform.NativeImage net.minecraft.client.renderer.texture.DynamicTexture; do echo "#### $c"; javap -public -cp "$MC" $c 2>&1 | grep -E "NativeImage\(|setPixel|getPixel|DynamicTexture\(|upload|fillRect|close" | cut -c1-200; done
          echo "#### ClientGameTestContext"
          javap -public -cp "$GT" net.fabricmc.fabric.api.client.gametest.v1.context.ClientGameTestContext 2>&1 | cut -c1-200
          javap -public -cp "$GT" net.fabricmc.fabric.api.client.gametest.v1.screenshot.TestScreenshotCommonOptions 2>&1 | cut -c1-200
      - name: Run the real Minecraft client and take screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
        run: |
          set +e
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain runClientGameTest --no-daemon --info > "$RUNNER_TEMP/game.log" 2>&1
          echo "exit: $?"
          wc -l "$RUNNER_TEMP/game.log"
          echo "---- game output (errors and Cirrus lines)"
          grep -nE "ERROR|FATAL|Exception|Caused by|cirrus|Cirrus|GLFW|OpenGL|Renderer|gametest|Screenshot|screenshot" "$RUNNER_TEMP/game.log" | grep -v "^\S*\s*at " | cut -c1-260 | head -120
          echo "---- first exception with stack"
          grep -n -m1 -A22 "Reported exception thrown" "$RUNNER_TEMP/game.log" | cut -c1-200
          echo "---- last 40 lines"
          tail -40 "$RUNNER_TEMP/game.log" | cut -c1-260
          find . -name '*.png' -path '*screenshots*' | head -80
      - name: Publish screenshots to the ingame-shots branch
        if: always()
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          find fabric-mod/build/run -path '*screenshots*' -name '*.png' -exec cp {} "$RUNNER_TEMP/shots/" \; || true
          find fabric-mod/run -path '*screenshots*' -name '*.png' -exec cp {} "$RUNNER_TEMP/shots/" \; || true
          ls "$RUNNER_TEMP/shots" | head -80
          cp -r fabric-mod/build/run/clientGameTest/logs "$RUNNER_TEMP/shots/logs" 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ingame-shots
          git rm -rf --quiet . || true
          git clean -fdxq
          cp -r "$RUNNER_TEMP/shots/." .
          git add -A
          git commit -q -m "In-game screenshots for ${GITHUB_SHA}" || echo "nothing to commit"
          git push -f origin ingame-shots
