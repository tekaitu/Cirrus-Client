name: Fabric in-game check

# Runs the real Minecraft 1.21.11 client with the Cirrus mod on a virtual display and publishes the screenshots.
on:
  push:
    branches: [fabric-ui-rendering]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: fabric-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install a virtual display and software OpenGL
        working-directory: .
        run: |
          sudo apt-get -o Acquire::Retries=4 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update -q
          sudo apt-get -o Acquire::Retries=4 -o Acquire::http::Timeout=25 install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libgl1 mesa-vulkan-drivers libxrandr2 libxxf86vm1 libxcursor1 libxi6 libopenal1
      - name: Unit tests
        run: java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain build --no-daemon
      - name: Dump protected widget hooks and GuiGraphics API
        if: always()
        continue-on-error: true
        run: |
          MC=$(find ~/.gradle -name '*.jar' | grep -iE 'minecraft-clientonly-1' | grep -v sources | head -1)
          GT=$(find ~/.gradle -name 'fabric-client-gametest-api-v1*.jar' | grep -v sources | head -1)
          show() { echo "#### $2"; javap -protected -cp "$1" "$2" 2>&1 | sed 's/net\.minecraft\.//g; s/java\.lang\.//g'; }
          for c in 'net.minecraft.client.gui.components.AbstractWidget' 'net.minecraft.client.gui.components.AbstractWidget$WithInactiveMessage' net.minecraft.client.gui.components.AbstractButton net.minecraft.client.gui.components.Button; do show "$MC" "$c"; done | grep -vE 'access\$|lambda\$' | cut -c1-200
          echo "#### GuiGraphics"
          javap -public -cp "$MC" net.minecraft.client.gui.GuiGraphics 2>&1 | sed 's/net\.minecraft\.//g; s/java\.lang\.//g' | grep -E "blit|fill|pose|drawString|drawCentered|Scissor|renderTooltip|nextStratum|guiWidth|guiHeight|setTooltip|renderOutline|textHighlight|drawWordWrap" | cut -c1-230
          for c in com.mojang.blaze3d.platform.NativeImage net.minecraft.client.renderer.texture.DynamicTexture; do echo "#### $c"; javap -public -cp "$MC" $c 2>&1 | grep -E "NativeImage\(|setPixel|getPixel|DynamicTexture\(|upload|fillRect|close" | cut -c1-200; done
          echo "#### MULTIPLAYER API"
          for c in net.minecraft.client.multiplayer.ServerStatusPinger net.minecraft.client.multiplayer.ServerData net.minecraft.client.multiplayer.ServerList net.minecraft.client.gui.screens.ConnectScreen net.minecraft.client.gui.screens.multiplayer.JoinMultiplayerScreen net.minecraft.client.gui.screens.multiplayer.ServerSelectionList net.minecraft.client.gui.screens.multiplayer.ServerSelectionList\$OnlineServerEntry net.minecraft.client.gui.screens.multiplayer.ManageServerScreen net.minecraft.client.gui.screens.multiplayer.DirectJoinServerScreen net.minecraft.client.multiplayer.resolver.ServerAddress net.minecraft.client.multiplayer.TransferState net.minecraft.client.gui.screens.options.SkinCustomizationScreen net.minecraft.client.gui.screens.PauseScreen net.minecraft.client.gui.screens.TitleScreen net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.screens.ConfirmLinkScreen net.minecraft.client.gui.screens.options.OptionsScreen net.minecraft.client.gui.screens.options.SkinCustomizationScreen; do show "$MC" "$c"; done | grep -vE 'access\$|lambda\$' | cut -c1-220
          echo "#### SELECTION LIST ENTRY API"
          for c in 'net.minecraft.client.gui.components.AbstractSelectionList$Entry' 'net.minecraft.client.gui.screens.multiplayer.ServerSelectionList$Entry' 'net.minecraft.client.gui.components.ObjectSelectionList$Entry' net.minecraft.client.input.KeyEvent net.minecraft.client.input.MouseButtonEvent; do show "$MC" "$c"; done | grep -vE 'access\$|lambda\$' | cut -c1-220
          echo "#### Skin/face classes"
          jar tf "$MC" | grep -iE 'Skin|PlayerFace|PlayerHead' | grep -v '\$' | head -40
          for c in net.minecraft.client.resources.SkinManager net.minecraft.client.renderer.PlayerSkinRenderCache net.minecraft.client.gui.screens.options.ChatOptionsScreen net.minecraft.client.gui.screens.options.LanguageSelectScreen net.minecraft.client.gui.screens.packs.PackSelectionScreen net.minecraft.client.gui.components.Tooltip net.minecraft.client.gui.components.AbstractSelectionList; do show "$MC" "$c"; done 2>&1 | grep -vE 'lambda\$' | cut -c1-200
          echo "#### Util/Platform/Screenshot"
          for c in net.minecraft.Util net.minecraft.util.Util net.minecraft.client.Screenshot net.minecraft.client.player.AbstractClientPlayer net.minecraft.client.resources.PlayerSkin net.minecraft.client.gui.components.PlayerFaceRenderer net.minecraft.client.User net.minecraft.client.gui.screens.inventory.InventoryScreen; do show "$MC" "$c"; done 2>&1 | grep -E "####|openUri|openPath|openFile|getPlatform|OS\b|saveScreenshot|grab|drawPlayerFace|draw\(|getSkin|skin|getName|getPlayerUuid|getSessionId|renderEntityInInventory|Screenshot" | cut -c1-220
          echo "#### INPUT API"
          for c in net.minecraft.client.MouseHandler net.minecraft.client.KeyboardHandler com.mojang.blaze3d.platform.InputConstants com.mojang.blaze3d.platform.Window net.minecraft.client.input.InputWithModifiers net.minecraft.client.input.MouseButtonInfo net.minecraft.client.input.CharacterEvent net.minecraft.client.gui.components.events.GuiEventListener net.minecraft.client.gui.components.events.ContainerEventHandler net.minecraft.client.KeyMapping; do show "$MC" "$c"; done 2>&1 | grep -vE 'lambda\$|access\$' | cut -c1-220
          echo "#### ClientGameTestContext"
          javap -public -cp "$GT" net.fabricmc.fabric.api.client.gametest.v1.context.ClientGameTestContext 2>&1 | cut -c1-200
          javap -public -cp "$GT" net.fabricmc.fabric.api.client.gametest.v1.screenshot.TestScreenshotCommonOptions 2>&1 | cut -c1-200
      - name: Run the real Minecraft client and take screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
        run: |
          set +e
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain runClientGameTest --no-daemon --info > "$RUNNER_TEMP/game.log" 2>&1
          echo "exit: $?"
          wc -l "$RUNNER_TEMP/game.log"
          echo "---- game output (errors and Cirrus lines)"
          grep -nE "ERROR|FATAL|Exception|Caused by|cirrus|Cirrus|GLFW|OpenGL|Renderer|gametest|Screenshot|screenshot" "$RUNNER_TEMP/game.log" | grep -v "^\S*\s*at " | cut -c1-260 | head -120
          echo "---- first exception with stack"
          grep -n -m1 -A22 "Reported exception thrown" "$RUNNER_TEMP/game.log" | cut -c1-200
          echo "---- last 40 lines"
          tail -40 "$RUNNER_TEMP/game.log" | cut -c1-260
          find . -name '*.png' -path '*screenshots*' | head -80
      - name: Publish screenshots to the ingame-shots branch
        if: always()
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          find fabric-mod/build/run -path '*screenshots*' -name '*.png' -exec cp {} "$RUNNER_TEMP/shots/" \; || true
          find fabric-mod/run -path '*screenshots*' -name '*.png' -exec cp {} "$RUNNER_TEMP/shots/" \; || true
          ls "$RUNNER_TEMP/shots" | head -80
          cp -r fabric-mod/build/run/clientGameTest/logs "$RUNNER_TEMP/shots/logs" 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ingame-shots
          git rm -rf --quiet . || true
          git clean -fdxq
          cp -r "$RUNNER_TEMP/shots/." .
          git add -A
          git commit -q -m "In-game screenshots for ${GITHUB_SHA}" || echo "nothing to commit"
          git push -f origin ingame-shots
