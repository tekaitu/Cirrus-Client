name: Build Cirrus Fabric companion

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fabric-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Build mod JAR
        run: ./gradlew.bat build
      - uses: actions/upload-artifact@v4
        with:
          name: cirrus-fabric-mod
          path: fabric-mod/build/libs/cirrus-fabric-0.1.0.jar
          if-no-files-found: error
