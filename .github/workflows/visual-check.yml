name: Visual check (screenshots)

# Builds the web part of the app and takes screenshots of every page in both appearances.
# The desktop commands are replaced by made-up data, so this checks LAYOUT only.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install JavaScript dependencies
        run: npm install
      - name: Build the frontend
        run: npx vite build
      - name: Install the screenshot tool
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Take screenshots
        run: node scripts/visual-check.mjs shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
      # The screenshots are also pushed to a side branch so they can be looked at without downloading.
      - name: Publish screenshots to the visual-shots branch
        if: always()
        run: |
          cp -r shots "$RUNNER_TEMP/shots"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan visual-shots
          git rm -rf --quiet . || true
          git clean -fdxq
          cp -r "$RUNNER_TEMP/shots/." .
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f origin visual-shots
