plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

group = project.maven_group
version = project.mod_version
base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file("src/main/resources/cirrus_fabric.accesswidener")

    mods {
        "cirrus_fabric" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Cirrus Core: pure Java (no Minecraft, loader or graphics library) in its own source folder. It is compiled with the client so it
// ships in the mod jar, and CoreBoundaryTest separately proves it compiles alone at Java 8 level with an empty classpath.
sourceSets {
    client {
        java.srcDir 'src/core/java'
    }
}

fabricApi {
    configureTests {
        createSourceSet = false
        modId = "cirrus_fabric"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
