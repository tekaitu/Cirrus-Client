[package]
name = "cirrus-client"
version = "0.1.0"
authors = ["Cirrus Client"]
description = "Cirrus Client: a Windows launcher for Minecraft Java 1.21.11 (interface and diagnostics build)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cirrus_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# Windows' own TLS stack (no OpenSSL to build); blocking client runs on a worker thread.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "json"] }
# Windows Credential Manager for the Microsoft refresh token
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
getrandom = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Discord Rich Presence over Discord's local IPC pipe (no network, no login)
discord-rich-presence = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
