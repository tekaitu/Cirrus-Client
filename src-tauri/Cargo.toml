[package]
name = "limited-fps"
version = "0.1.0"
description = "Limited FPS: a Windows launcher for Minecraft Java 1.21.11 (foundation build)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "limited_fps_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
